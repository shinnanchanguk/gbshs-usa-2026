name: Community checks

on:
  pull_request:
  push:
    branches: [codex/trip-community]

permissions:
  contents: read

jobs:
  community:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run test:community
      - run: npx playwright install --with-deps chromium
      - run: npm run test:community:browser
      - run: npm run build
